# Project settings for the Ralph engine. This file is sourced by bash. {{AREA}} inside a command is replaced per area.
# Anything here can also be overridden from the environment (ITEM_TIMEOUT=600 ralph run ...).

REPO="@REPO@"                 # the git repo the loop builds in (must be on BASE_BRANCH, clean)
BASE_BRANCH=main
LOOP_DIR=ralph                # folder inside REPO with SPEC.md, CONTRACTS.md, tasks/ (ralph init creates it)
RULES_FILE=CLAUDE.md          # the repo's own coding rules; workers read it if it exists

# Areas run in parallel, each in its own git worktree on its own branch. One area is fine for a simple project.
AREAS=(@AREAS@)
# Files an area may change (regex on repo-relative paths). Edits outside are logged as warnings, never reverted.
@OWNS@
INTEGRATION_FILES='^(CLAUDE\.md|README\.md)'   # shared files anyone may touch

# Optional: use existing worktrees/branches instead of letting setup create them under runs/<name>/worktrees.
# AREA_WORKTREE[world]=/path/to/worktree-1
# AREA_BRANCH[world]=work-1

# Checks. Quick one after every item; full gate in the quality pass, at merge time and as the end-of-round backstop.
# Each runs with `bash -e` in the checkout. Empty = no check. Keep the item check cheap: parallel workers share the machine.
ITEM_CHECK='echo "TODO: fast checks, e.g. lint + the area test suite"'
FULL_CHECK='echo "TODO: full gate, e.g. format, build, all tests, lint"'
QUALITY_CMD=''                # optional report command run in the quality pass (e.g. a code-quality tool)

# Pace and limits (defaults shown).
# QUALITY_EVERY=3  MAX_ITEMS_PER_ROUND=24  MAX_ITEM_FAILS=3  ITEM_TIMEOUT=2700  RALPH_MAX_ROUNDS=30
# SKELETON_STEP=1       # 0 to skip round 0 (the shared-interface skeleton) when the repo already has structure
# CLAUDE_MODEL=         # pass --model to every session
# NICE_LEVEL=10         # lower priority so the machine stays usable

# Docker sandbox (see docker/). Image, limits, and extra folders to mount at the same path (e.g. existing worktrees).
DOCKER_IMAGE=ralph-base
# DOCKER_CPUS=6  DOCKER_MEMORY=9g
# DOCKER_MOUNTS=(/path/one /path/two)
# Build-tool env for the checks goes here too, e.g.: export CARGO_BUILD_JOBS=3

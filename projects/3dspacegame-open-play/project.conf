# Loop 1: the "Open Play" mode of ~/Code/3dSpaceGameWT/3dSpaceGame (Rust, macroquad).
# Original hand-built scripts and specs are kept in reference/3dspacegame-open-play/ (the loop files themselves
# live in the game repo's ralph/ folder).

REPO="$HOME/Code/3dSpaceGameWT/3dSpaceGame"
BASE_BRANCH=main
LOOP_DIR=ralph
RULES_FILE=CLAUDE.md

AREAS=(world flight interface)
# Run 1 reused the three existing worktrees:
AREA_WORKTREE[world]="$HOME/Code/3dSpaceGameWT/worktree-1";     AREA_BRANCH[world]=work-1
AREA_WORKTREE[flight]="$HOME/Code/3dSpaceGameWT/worktree-2";    AREA_BRANCH[flight]=work-2
AREA_WORKTREE[interface]="$HOME/Code/3dSpaceGameWT/worktree-3"; AREA_BRANCH[interface]=work-3
DOCKER_MOUNTS=("$HOME/Code/3dSpaceGameWT")

AREA_OWNS[world]='^(src/open_play/(world|host|save)/|src/server/|src/bin/|src/shared/net/open_play/)'
AREA_OWNS[flight]='^src/open_play/flight/'
AREA_OWNS[interface]='^src/open_play/interface/'
INTEGRATION_FILES='^(src/open_play/mod\.rs|src/open_play/contracts/|src/lib\.rs|src/main\.rs|src/shared/game/mod\.rs|src/shared/menu/modes\.rs|src/shared/net/messages/|CLAUDE\.md|README\.md|Cargo\.(toml|lock))'

# Lesson from run 1: the full gate after every item (3 workers at once) pushed load to ~33 on a 12 GB box.
ITEM_CHECK='cargo fmt && cargo check && cargo test open_play::{{AREA}}'
FULL_CHECK='cargo fmt; python3 scripts/check_spacing.py --fix; cargo build 2>&1; cargo test 2>&1; cargo clippy --all-targets -- -D warnings 2>&1'
QUALITY_CMD='codequality --full'
export CARGO_BUILD_JOBS=3

DOCKER_IMAGE=ralph-rust
DOCKER_CPUS=6
DOCKER_MEMORY=9g
